[package]
name = "hanyeong-indicator"
version = "0.1.0"
edition = "2024"
description = "텍스트 커서 옆에 한/영 입력 상태를 표시하는 macOS·Windows 상주 앱"
license = "MIT"
publish = false
# 바이너리가 둘(앱 본체, 진단 도구)이라 `cargo run`이 앱 본체를 실행하도록 지정한다.
default-run = "hanyeong-indicator"

[lib]
path = "src/lib.rs"

# 1단계(기술 검증)용 콘솔 도구. 입력 모드와 캐럿 위치를 출력한다.
# 앱 본체가 생긴 뒤에도 사용자 환경 진단용으로 유지한다.
[[bin]]
name = "hanyeong-probe"
path = "src/bin/probe/main.rs"

[dependencies]
auto-launch = "0.6"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tray-icon = "0.26"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
