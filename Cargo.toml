[package]
name = "hanyeong-indicator"
version = "0.1.0"
edition = "2024"
description = "텍스트 커서 옆에 한/영 입력 상태를 표시하는 macOS·Windows 상주 앱"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

# 1단계(기술 검증)용 콘솔 도구. 입력 모드와 캐럿 위치를 출력한다.
# 앱 본체가 생긴 뒤에도 사용자 환경 진단용으로 유지한다.
[[bin]]
name = "hanyeong-probe"
path = "src/bin/probe/main.rs"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62.2"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
